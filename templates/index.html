<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blender Module Dissector</title>
    <style>
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 0; }
      main { max-width: 720px; margin: 3rem auto; padding: 0 1rem; }
      header { text-align: center; margin-bottom: 2rem; }
      .card { border: 1px solid #ddd; border-radius: 10px; padding: 1.5rem; box-shadow: 0 4px 12px rgba(0,0,0,.06); }
      .alert { background: #ffe6e6; border: 1px solid #f5c2c7; padding: 0.9rem; border-radius: 8px; margin-bottom: 1rem; }
      label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
      input[type=file] { width: 100%; }
      button { background: #006eff; color: white; border: none; padding: 0.75rem 1.2rem; border-radius: 8px; cursor: pointer; font-size: 1rem; }
      button:hover { background: #0051c7; }
      footer { text-align: center; margin-top: 3rem; color: #666; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Blender Module Dissector</h1>
        <p>Upload a <code>.blend</code> or <code>.py</code> file to inspect its contents.</p>
      </header>

      <section class="card">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert">
              <ul style="margin:0; padding-left:1.2rem;">
                {% for m in messages %}
                  <li>{{ m }}</li>
                {% endfor %}
              </ul>
            </div>
          {% endif %}
        {% endwith %}

        <form method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data">
          <label for="blend_file">Select a .blend file</label>
          <input type="file" name="blend_file" id="blend_file" accept=".blend" required />
          <div style="margin-top: 1rem;">
            <button type="submit">Inspect</button>
          </div>
        </form>
      </section>

      <footer>
        <p>Built for explorative Blender module inspection.</p>
      </footer>
    </main>
  </body>
</html>
